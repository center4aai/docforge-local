[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docforge-local"
version = "0.1.3"
description = "Local-first CLI for generating repository documentation with deterministic code facts and MkDocs publishing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
keywords = ["documentation", "mkdocs", "cli", "local-first", "llm"]
dependencies = [
  "jinja2>=3.1",
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "openai>=1.40",
  "pypdf>=4.3",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "docx2txt>=0.8",
  "platformdirs>=4.3",
  "tomlkit>=0.13",
  "pathspec>=0.12",
  "keyring>=25.0",
]


[project.scripts]
docforge-local = "repo_autodocs.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_autodocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
